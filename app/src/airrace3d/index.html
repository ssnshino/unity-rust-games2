<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AIRRACE3D2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111f;color:#f7e38b;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
    #boot{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:flex-start;padding:24px;background:linear-gradient(#07111f,#12233a);z-index:10}
    #boot-panel{max-width:860px;line-height:1.55;font-size:18px;text-shadow:0 2px 8px #000}
    #boot h1{margin:0 0 28px;font-size:28px;color:#f7e38b}
    #unity-container{position:fixed;inset:0}
    #unity-canvas{width:100%;height:100%;background:#07111f}
  </style>
</head>
<body>
  <div id="boot"><div id="boot-panel"><h1>AIR RACE 3D2 LOADING</h1><div id="boot-log">booting...</div></div></div>
  <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <script>
    const logEl = document.getElementById("boot-log");
    const lines = [];
    function stamp(){ return new Date().toTimeString().slice(0,8); }
    function bootLog(text){ lines.push(`[${stamp()}] ${text}`); logEl.textContent = lines.join("\n"); }
    window.addEventListener("error", e => bootLog(`JS ERROR: ${e.message}`));
    window.addEventListener("unhandledrejection", e => bootLog(`PROMISE ERROR: ${e.reason}`));
    bootLog("loading Unity WebGL files...");
    const buildUrl = "Build";
    const loaderUrl = `${buildUrl}/WebGL.loader.js`;
    const config = {
      dataUrl: `${buildUrl}/WebGL.data.gz`,
      frameworkUrl: `${buildUrl}/WebGL.framework.js.gz`,
      codeUrl: `${buildUrl}/WebGL.wasm.gz`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Shinomiya",
      productName: "AIRRACE3D2",
      productVersion: "0.1.0"
    };
    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      bootLog("loader ready, creating Unity instance...");
      createUnityInstance(document.getElementById("unity-canvas"), config, progress => {
        bootLog(`progress ${Math.round(progress * 100)}%`);
      }).then(instance => {
        window.unityInstance = instance;
        bootLog("runtime started");
        setTimeout(() => document.getElementById("boot").style.display = "none", 600);
      }).catch(error => {
        bootLog(`UNITY FAILED: ${error}`);
        alert(`An error occurred running the Unity content on this page. See your browser JavaScript console for more info. The error was: ${error}`);
      });
    };
    script.onerror = () => bootLog("loader script failed");
    document.body.appendChild(script);
  </script>
</body>
</html>
